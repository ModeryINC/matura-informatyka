# CI/CD: testy przy każdym pushu i pull requeście, wdrożenie na GitHub Pages z gałęzi main.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Lint, typy, testy i build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run catalog
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      # Kontrolny build bez klucza AI – strona wdrażana jest budowana w jobie deploy.
      - name: Build (z bazową ścieżką GitHub Pages)
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

  python:
    name: Harness Pythona i rozwiązania wzorcowe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Pyodide 314 to Python 3.14 – testujemy na tej samej wersji.
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:python
      - name: Weryfikacja kluczy odpowiedzi rozwiązaniami wzorcowymi
        run: npm run verify:solutions

  deploy:
    name: Wdrożenie na GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [frontend, python]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Klucz Gemini jest dostępny tylko w środowisku github-pages, dlatego build do
      # wdrożenia odbywa się tutaj. Uwaga: klucz trafia do publicznego bundla JS
      # (strona nie ma serwera) – ogranicz go w Google Cloud, patrz docs/podpowiedzi-ai.md.
      - name: Build strony z podpowiedziami AI
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_AI_API_KEY: ${{ secrets.AI_API_KEY || vars.AI_API_KEY }}
          VITE_AI_MODEL: ${{ vars.AI_MODEL }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
