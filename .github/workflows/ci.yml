# CI/CD: testy przy każdym pushu i pull requeście, wdrożenie na GitHub Pages z gałęzi main.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Lint, typy, testy i build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run catalog
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      # Kontrolny build bez klucza AI – strona wdrażana jest budowana w jobie deploy.
      - name: Build (z bazową ścieżką GitHub Pages)
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

  python:
    name: Harness Pythona i rozwiązania wzorcowe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # Pyodide 314 to Python 3.14 – testujemy na tej samej wersji.
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:python
      - name: Weryfikacja kluczy odpowiedzi rozwiązaniami wzorcowymi
        run: npm run verify:solutions
      - name: Przykłady z „Podstaw Pythona” działają
        run: npm run verify:basics
      - name: Klucze zadań z Excela zgadzają się z obliczeniami wzorcowymi
        run: npm run verify:excel

  ai-proxy:
    name: Pośrednik podpowiedzi AI (Cloudflare Worker)
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [frontend]
    runs-on: ubuntu-latest
    # Środowisko github-pages ma sekrety AI_API_KEY, CLOUDFLARE_API_TOKEN i CLOUDFLARE_ACCOUNT_ID.
    environment: github-pages
    outputs:
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v7
      # Zmienne (vars) GitHub wypisuje w logach otwartym tekstem, a logi publicznego repo
      # widzi każdy – klucz i token muszą być sekretami (w logach jako ***).
      - name: Klucz i token muszą być sekretami
        if: vars.AI_API_KEY != '' || vars.CLOUDFLARE_API_TOKEN != ''
        run: |
          echo "::error::AI_API_KEY i CLOUDFLARE_API_TOKEN zapisz jako sekrety (Environment secrets), nie zmienne – zmienne są widoczne w publicznych logach. Usuń je ze zmiennych."
          exit 1
      - id: check
        name: Sprawdź konfigurację Cloudflare
        run: echo "enabled=${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.AI_API_KEY != '' }}" >> "$GITHUB_OUTPUT"
      # Czytelny błąd zamiast „Authentication error” z wranglera. Wypisuje tylko wynik,
      # nigdy wartości sekretów.
      - name: Sprawdź token Cloudflare i klucz
        if: steps.check.outputs.enabled == 'true'
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          KEY: ${{ secrets.AI_API_KEY }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for name in TOKEN KEY; do
            if printf '%s' "${!name}" | grep -q '[[:space:]]'; then
              echo "::error::Sekret ($name) zawiera spacje lub znaki nowej linii – wklej go ponownie."
              exit 1
            fi
          done
          api=https://api.cloudflare.com/client/v4
          # Kod HTTP i kody błędów Cloudflare dla zapytania (bez treści odpowiedzi).
          probe() {
            local body code
            body=$(curl -sS -w '\n%{http_code}' -H "Authorization: Bearer $TOKEN" "$api$1")
            code=$(echo "$body" | tail -n1)
            echo "$1 → HTTP $code $(echo "$body" | sed '$d' | jq -c '[.errors[]?.code]' 2>/dev/null)"
            [ "$code" = 200 ]
          }
          user_token=false; account_token=false
          probe /user/tokens/verify && user_token=true
          probe "/accounts/$ACCOUNT_ID/tokens/verify" && account_token=true
          if [ "$user_token" != true ] && [ "$account_token" != true ]; then
            echo "::error::Cloudflare odrzuca CLOUDFLARE_API_TOKEN – utwórz nowy token (szablon „Edit Cloudflare Workers”) i zapisz go jako sekret."
            exit 1
          fi
          echo "Token aktywny (użytkownika: $user_token, konta: $account_token)."
          if ! probe "/accounts/$ACCOUNT_ID/workers/scripts"; then
            echo "::error::Token nie ma uprawnienia do Workerów na koncie z CLOUDFLARE_ACCOUNT_ID – w tokenie dodaj Account → Workers Scripts → Edit dla swojego konta."
            exit 1
          fi
          probe /memberships || echo "::warning::Token nie odczyta listy kont (Memberships) – wrangler może tego potrzebować."
      # Klucz Gemini trafia wyłącznie do Workera jako sekret GEMINI_API_KEY.
      - id: deploy
        if: steps.check.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: latest
          workingDirectory: worker
          secrets: |
            GEMINI_API_KEY
        env:
          GEMINI_API_KEY: ${{ secrets.AI_API_KEY }}

  pages-build:
    name: Build strony do wdrożenia
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [frontend, python, ai-proxy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Strona dostaje tylko adres pośrednika – żadnego klucza. Bez Workera
      # (brak CLOUDFLARE_API_TOKEN i AI_ENDPOINT) podpowiedzi AI są wyłączone.
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_AI_ENDPOINT: ${{ needs.ai-proxy.outputs.url || vars.AI_ENDPOINT }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Wdrożenie na GitHub Pages
    needs: pages-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
