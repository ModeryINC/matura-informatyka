# Pośrednik podpowiedzi AI – Cloudflare Worker (patrz docs/podpowiedzi-ai.md).
# Wdrażany automatycznie z GitHub Actions; klucz Gemini jest sekretem GEMINI_API_KEY
# (wgrywanym przez workflow z AI_API_KEY), nigdy nie trafia do tego pliku.
name = "matura-informatyka-ai"
main = "src/index.ts"
compatibility_date = "2026-06-01"
workers_dev = true

[vars]
# Strony, z których wolno wysyłać zapytania (po przecinku).
ALLOWED_ORIGINS = "https://moderyinc.github.io,http://localhost:5173,http://localhost:5174"
AI_MODEL = "gemini-3.5-flash-lite"

# Najwyżej 5 podpowiedzi na minutę z jednego adresu IP.
[[ratelimits]]
name = "HINT_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
